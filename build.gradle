plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped" // Show passed, failed, and skipped tests
        showStandardStreams = true // Show system output (e.g., print statements in tests)
    }
}
//Increase the size of the heap to 1GB for tests
tasks.test {
    maxHeapSize = "1G"
}

application {
    mainClass = 'com.example.ip4counter.Main'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.example.ip4counter.Main'
        )
    }
}